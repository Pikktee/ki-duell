<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>ECHT ODER KI? — Logo-Demo</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600;800&family=Playfair+Display:ital,wght@1,600;0,700&display=swap" rel="stylesheet" />
  <style>
    :root { --cyan:#00f0ff; --magenta:#ff2bd6; --bg:#06070d; }
    * { box-sizing:border-box; }
    body { margin:0; min-height:100vh; background:
        radial-gradient(900px 500px at 50% 30%, #10182e 0%, var(--bg) 60%);
      display:grid; place-items:center; font-family:system-ui, sans-serif; overflow:hidden; }
    /* dezentes Neon-Grid + Scanlines */
    body::before { content:""; position:fixed; inset:0; pointer-events:none; opacity:.25;
      background:
        linear-gradient(transparent 0 2px, rgba(0,240,255,.04) 2px 3px) 0 0/100% 4px,
        linear-gradient(90deg, rgba(255,43,214,.05) 1px, transparent 1px) 0 0/40px 40px,
        linear-gradient(rgba(0,240,255,.05) 1px, transparent 1px) 0 0/40px 40px; }

    .logo { text-align:center; user-select:none; animation:flickerIn 1.1s ease-out both; }
    .wordmark { line-height:.95; }

    .echt { display:block; font-family:"Playfair Display", serif; font-style:italic;
      font-weight:700; font-size:clamp(38px, 9vw, 96px); letter-spacing:.02em;
      color:#eafcff; text-shadow:0 0 14px rgba(0,240,255,.55), 0 0 40px rgba(0,240,255,.25);
      animation:pulseCyan 3.6s ease-in-out infinite; }

    /* "KI?" mit Glitch */
    .ki { position:relative; display:inline-block; font-family:"Orbitron", sans-serif;
      font-weight:800; font-size:clamp(54px, 14vw, 150px); letter-spacing:.04em;
      color:#fff; text-shadow:0 0 16px rgba(255,43,214,.6), 0 0 46px rgba(255,43,214,.3);
      margin-top:.05em; }
    .ki::before, .ki::after { content:"KI?"; position:absolute; inset:0; }
    .ki::before { color:var(--cyan); mix-blend-mode:screen; animation:glitchA 2.8s infinite steps(1); }
    .ki::after { color:var(--magenta); mix-blend-mode:screen; animation:glitchB 2.8s infinite steps(1); }

    .tag { margin-top:18px; font-family:"Orbitron", sans-serif; font-weight:600;
      font-size:clamp(11px, 2.4vw, 15px); letter-spacing:.32em; text-transform:uppercase;
      color:#9fb2c9; }
    .tag .sep { color:var(--magenta); }

    /* Scanline-Sweep über das Logo */
    .logo::after { content:""; position:absolute; left:0; right:0; height:36%;
      background:linear-gradient(rgba(0,240,255,.10), transparent);
      mix-blend-mode:screen; pointer-events:none; animation:sweep 5s linear infinite; }
    .logo { position:relative; }

    @keyframes flickerIn {
      0%{opacity:0} 10%{opacity:.4} 12%{opacity:.1} 20%{opacity:.9}
      24%{opacity:.3} 30%{opacity:1} 100%{opacity:1} }
    @keyframes pulseCyan {
      0%,100%{ text-shadow:0 0 14px rgba(0,240,255,.5), 0 0 40px rgba(0,240,255,.22) }
      50%{ text-shadow:0 0 22px rgba(0,240,255,.8), 0 0 60px rgba(0,240,255,.4) } }
    @keyframes glitchA {
      0%,82%,100%{ transform:translate(0,0); clip-path:inset(0 0 0 0) }
      84%{ transform:translate(-3px,-2px); clip-path:inset(12% 0 58% 0) }
      88%{ transform:translate(2px,1px); clip-path:inset(70% 0 8% 0) }
      92%{ transform:translate(-2px,2px); clip-path:inset(40% 0 38% 0) } }
    @keyframes glitchB {
      0%,82%,100%{ transform:translate(0,0); clip-path:inset(0 0 0 0) }
      84%{ transform:translate(3px,2px); clip-path:inset(60% 0 12% 0) }
      88%{ transform:translate(-2px,-1px); clip-path:inset(10% 0 70% 0) }
      92%{ transform:translate(2px,-2px); clip-path:inset(36% 0 42% 0) } }
    @keyframes sweep { 0%{ top:-40% } 100%{ top:120% } }

    @media (prefers-reduced-motion: reduce) {
      .logo, .echt, .ki::before, .ki::after, .logo::after { animation:none !important; }
      .ki::before, .ki::after { opacity:.25; } /* dezenter statischer RGB-Schimmer */
    }
  </style>
</head>
<body>
  <div class="logo">
    <div class="wordmark">
      <span class="echt">Echt oder</span>
      <span class="ki">KI?</span>
    </div>
    <div class="tag">Trainiere dein Auge <span class="sep">·</span> für künstliche Kunst</div>
  </div>
</body>
</html>
